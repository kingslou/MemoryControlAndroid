plugins {
    id 'com.android.library' version '8.4.2'
    id 'com.android.application' version '8.4.2' apply false
    id 'maven-publish'
}

group = 'com.github.kingslou'
version = '1.0.1'

android {
    namespace 'io.github.kingslou.memorycontrol'
    compileSdk 34

    defaultConfig {
        minSdk 23
    }

    resourcePrefix 'mc_'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group.toString()
                artifactId = 'MemoryControlAndroid'
                version = project.version.toString()
                pom {
                    name = 'MemoryControlAndroid'
                    description = 'Android floating memory monitor and Java/Native pressure simulator'
                    url = 'https://github.com/kingslou/MemoryControlAndroid'
                    scm {
                        url = 'https://github.com/kingslou/MemoryControlAndroid'
                        connection = 'scm:git:https://github.com/kingslou/MemoryControlAndroid.git'
                    }
                }
            }
        }
    }
}
